name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Decrypt site media
        env:
          MEDIA_PASSPHRASE: ${{ secrets.MEDIA_PASSPHRASE }}
        run: |
          test -n "$MEDIA_PASSPHRASE"
          openssl enc -d -aes-256-cbc -md sha256 -pbkdf2 -iter 600000 -salt \
            -in fotos.enc -out fotos.tar.gz -pass env:MEDIA_PASSPHRASE
          tar -xzf fotos.tar.gz
          rm fotos.tar.gz
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
