<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e0f1c">
<meta name="robots" content="noindex, nofollow">
<title>Daniela — Comunicación Social</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<!--
  ============================================================
  ESTE ARCHIVO NO SE EDITA A MANO (salvo el bloque CONFIG del final).
  ============================================================
  Los textos de la página (hero, logros, carta, mensaje privado) NO están
  aquí en claro: viven en la carpeta secreto/ y entran cifrados con las
  claves. Para cambiar cualquier texto o clave:
      1. edita secreto/contenido.html, secreto/privado.html o secreto/claves.json
      2. corre:  node cifrar.js
      3. vuelve a subir la carpeta sitio/ a Netlify
  Lo único que sí se edita aquí es CONFIG (fecha del contador y lista de
  fotos/videos), al final del archivo. Lee el README.md.
  ============================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     1. TOKENS — colores, radios, espaciado, curvas
     ============================================================ */
  :root{
    --ink:#150a14;
    --bg:#1e0f1c;
    --bg-2:#2a1526;
    --glass:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.028));
    --glass-strong:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.045));
    --line:rgba(255,255,255,.10);
    --line-soft:rgba(255,255,255,.06);

    --cream:#fdf3f6;
    --muted:#d9bfcd;

    /* Acento rosa, con su hermano oro rosa para los brillos */
    --coral:#ff8fb4;
    --amber:#e9c08a;
    --on-accent:#1a0f18;
    --rose:#ff9ec4;
    --rose-deep:#c8446b;
    --rose-soft:#ffd3e2;
    --leaf:#9fc0a4;

    --r-xl:32px;
    --r-lg:24px;
    --r-md:18px;
    --r-sm:12px;
    --r-pill:999px;

    --maxw:1120px;
    --gap:clamp(16px,2.4vw,26px);
    --chapter-y:clamp(78px,11vw,150px);

    --shadow-soft:0 22px 60px -26px rgba(6,3,14,.75);
    --shadow-lift:0 30px 70px -24px rgba(6,3,14,.85);

    --ease-out:cubic-bezier(.22,.61,.36,1);
    --ease-soft:cubic-bezier(.32,.72,0,1);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;overflow-x:clip;}
  body{
    margin:0;
    overflow-x:clip;
    font-family:'Outfit',system-ui,sans-serif;
    font-weight:400;
    color:var(--cream);
    background:var(--bg);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{margin:0;font-weight:600;line-height:1.08;letter-spacing:-.03em;text-wrap:balance;}
  p{margin:0;}
  img,video{display:block;max-width:100%;}
  button{font:inherit;color:inherit;}
  .hidden{display:none !important;}
  :focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:6px;}
  .mono{font-family:'DM Mono',ui-monospace,monospace;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;}

  /* ============================================================
     2. FONDO — brillos, pétalos, grano
     ============================================================ */
  .blooms{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .bloom{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;will-change:transform;}
  .bloom.b1{width:52vw;height:52vw;left:-12vw;top:-10vh;background:radial-gradient(circle,rgba(255,143,180,.34),transparent 68%);}
  .bloom.b2{width:50vw;height:50vw;right:-12vw;top:16vh;background:radial-gradient(circle,rgba(233,192,138,.30),transparent 66%);}
  .bloom.b3{width:60vw;height:60vw;left:8vw;bottom:-24vh;background:radial-gradient(circle,rgba(255,143,180,.20),transparent 70%);}
  .petals{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
  .petal{
    position:absolute;top:-6vh;width:14px;height:14px;
    background:linear-gradient(140deg,var(--rose-soft),var(--rose-deep));
    border-radius:70% 0 70% 0;opacity:0;
    animation:petalFall linear infinite;will-change:transform;
  }
  @keyframes petalFall{
    0%{transform:translate3d(0,-10vh,0) rotate(0deg);opacity:0;}
    12%{opacity:.55;}
    88%{opacity:.45;}
    100%{transform:translate3d(var(--drift,40px),112vh,0) rotate(540deg);opacity:0;}
  }
  .sprig{display:block;margin:0 auto;width:132px;color:var(--rose);opacity:.5;}
  .rose-mark{color:var(--rose-deep);}
  .grain{
    position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.035;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  }

  /* ============================================================
     3. SUPERFICIES
     ============================================================ */
  .card{
    background:var(--glass);
    border:1px solid var(--line);
    border-radius:var(--r-lg);
    box-shadow:var(--shadow-soft), inset 0 1px 0 rgba(255,255,255,.07);
    backdrop-filter:blur(16px) saturate(130%);
    -webkit-backdrop-filter:blur(16px) saturate(130%);
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    padding:14px 24px;border:none;border-radius:var(--r-pill);
    background:linear-gradient(180deg,var(--amber),var(--coral));
    color:var(--on-accent);font-weight:600;font-size:1rem;letter-spacing:-.01em;
    cursor:pointer;
    box-shadow:0 14px 30px -14px rgba(255,143,180,.55);
    transition:transform 150ms var(--ease-out), box-shadow 200ms var(--ease-out), filter 150ms var(--ease-out), opacity 150ms var(--ease-out);
  }
  .btn:active{transform:scale(.97);}
  .btn[disabled]{opacity:.65;cursor:progress;transform:none;}
  .btn-ghost{background:var(--glass-strong);color:var(--cream);border:1px solid var(--line);box-shadow:none;}

  /* ============================================================
     4. PROGRESO + ENTRADA (candado principal)
     ============================================================ */
  #progress{
    position:fixed;top:0;left:0;right:0;height:3px;z-index:300;
    background:linear-gradient(90deg,var(--coral),var(--amber));
    transform:scaleX(0);transform-origin:0 50%;
  }
  @supports (animation-timeline:scroll()){
    #progress{animation:progressGrow linear both;animation-timeline:scroll(root block);}
    @keyframes progressGrow{from{transform:scaleX(0);}to{transform:scaleX(1);}}
  }

  #gate{
    position:fixed;inset:0;z-index:250;
    display:grid;place-items:center;padding:24px;
    background:
      radial-gradient(120% 90% at 15% 8%,rgba(255,143,180,.22),transparent 60%),
      radial-gradient(100% 80% at 85% 90%,rgba(233,192,138,.16),transparent 60%),
      var(--ink);
    transition:opacity 460ms var(--ease-out), filter 460ms var(--ease-out);
  }
  #gate.closing{opacity:0;filter:blur(10px);pointer-events:none;}
  .gate-card{
    width:100%;max-width:400px;padding:clamp(28px,5vw,42px);
    text-align:center;border-radius:var(--r-xl);
    animation:gateIn 700ms var(--ease-soft) both;
  }
  @keyframes gateIn{from{opacity:0;transform:translateY(16px) scale(.97);filter:blur(6px);}to{opacity:1;transform:none;filter:blur(0);}}
  .gate-seal{
    width:56px;height:56px;margin:0 auto 20px;border-radius:var(--r-pill);
    display:grid;place-items:center;font-size:24px;
    background:var(--glass-strong);border:1px solid var(--line);
  }
  .gate-card h1{font-size:clamp(1.9rem,6vw,2.4rem);margin-bottom:10px;}
  .gate-card .sub{color:var(--muted);font-size:.98rem;margin-bottom:26px;font-weight:300;}
  .field{
    width:100%;padding:15px 18px;margin-bottom:14px;
    border-radius:var(--r-pill);border:1px solid var(--line);
    background:rgba(255,255,255,.05);color:var(--cream);
    font:inherit;text-align:center;
    transition:border-color 200ms var(--ease-out), background 200ms var(--ease-out);
  }
  .field::placeholder{color:rgba(240,235,230,.42);}
  .field:focus{outline:none;border-color:var(--coral);background:rgba(255,255,255,.08);}
  .gate-card .btn{width:100%;}
  .err{min-height:22px;margin-top:12px;font-size:.86rem;color:var(--amber);}
  .shake{animation:shake 260ms var(--ease-out);}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

  /* ============================================================
     5. ESTRUCTURA
     ============================================================ */
  main{position:relative;z-index:2;opacity:0;}
  main.revealed{opacity:1;transition:opacity 620ms var(--ease-out);}
  .wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 clamp(20px,5vw,32px);}
  .chapter{padding:var(--chapter-y) 0;}
  .chapter-tag{
    position:sticky;top:16px;z-index:20;
    display:inline-flex;align-items:center;gap:10px;
    padding:10px 18px;border-radius:var(--r-pill);
    background:#2b1727;border:1px solid var(--line);
    box-shadow:0 10px 26px -12px rgba(0,0,0,.85);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    color:var(--muted);
  }
  .chapter-tag .count{opacity:.6;}
  .chapter-tag b{color:var(--coral);font-weight:500;}
  .chapter-title{font-size:clamp(2.1rem,6.2vw,3.6rem);margin:26px 0 14px;max-width:22ch;}
  .chapter-lede{color:var(--muted);font-weight:300;max-width:56ch;margin-bottom:clamp(30px,5vw,46px);}
  .rise{opacity:0;transform:translateY(26px);filter:blur(6px);}
  .rise.in{
    opacity:1;transform:none;filter:blur(0);
    transition:opacity 760ms var(--ease-out), transform 760ms var(--ease-soft), filter 760ms var(--ease-out);
  }

  /* ============================================================
     6. HERO
     ============================================================ */
  #hero{min-height:100svh;display:grid;align-items:center;padding:96px 0 60px;}
  .hero-grid{display:grid;grid-template-columns:1.02fr .98fr;align-items:center;gap:clamp(20px,4vw,56px);}
  .hero-inner{max-width:640px;}
  .hero-portrait{margin:0;position:relative;justify-self:center;}
  .hero-portrait::before{
    content:"";position:absolute;inset:-12%;border-radius:50%;z-index:-1;
    background:radial-gradient(circle,rgba(255,143,180,.34),transparent 66%);
    filter:blur(22px);
  }
  .hero-portrait img{width:100%;max-width:420px;height:auto;border-radius:50%;animation:portraitFloat 9s ease-in-out infinite;}
  @keyframes portraitFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  @media(max-width:860px){
    .hero-grid{grid-template-columns:1fr;}
    .hero-portrait{order:-1;}
    .hero-portrait img{max-width:min(260px,62vw);}
    .hero-inner{max-width:none;}
  }
  .eyebrow{color:var(--coral);display:inline-block;margin-bottom:22px;}
  #hero h1{font-size:clamp(2.6rem,6.4vw,4.9rem);font-weight:600;margin-bottom:24px;}
  #hero h1 em{font-style:italic;font-family:'Lora',serif;font-weight:400;letter-spacing:-.01em;}
  .lede{font-size:clamp(1.05rem,2.4vw,1.3rem);color:var(--muted);font-weight:300;max-width:52ch;}
  .cue{display:inline-flex;align-items:center;gap:12px;margin-top:clamp(38px,6vw,58px);color:var(--muted);text-decoration:none;}
  .cue span{width:38px;height:38px;border-radius:var(--r-pill);display:grid;place-items:center;
    background:var(--glass-strong);border:1px solid var(--line);animation:nudge 2.4s var(--ease-out) infinite;}
  @keyframes nudge{0%,100%{transform:translateY(0);}50%{transform:translateY(7px);}}
  @supports (animation-timeline:view()){
    @media (prefers-reduced-motion:no-preference){
      .hero-grid{animation:heroLeave linear both;animation-timeline:view();animation-range:exit 0% exit 92%;}
      @keyframes heroLeave{to{opacity:.12;transform:translateY(-30px) scale(.975);filter:blur(3px);}}
    }
  }

  /* ============================================================
     7. CAPÍTULO 01 — CONTADOR
     ============================================================ */
  .counter{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap);}
  .count-box{padding:clamp(18px,3vw,28px);border-radius:var(--r-lg);text-align:center;}
  .count-box .n{
    display:block;font-size:clamp(1.9rem,5.4vw,3rem);font-weight:600;
    font-variant-numeric:tabular-nums;letter-spacing:-.04em;
    background:linear-gradient(180deg,var(--cream),var(--amber));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .count-box .l{color:var(--muted);margin-top:6px;}
  .since{margin-top:20px;color:var(--muted);font-size:.92rem;font-weight:300;}
  @media(max-width:620px){.counter{grid-template-columns:repeat(2,1fr);}}

  /* ============================================================
     8. CAPÍTULO 02 — LOGROS
     ============================================================ */
  .timeline{position:relative;padding-left:clamp(28px,5vw,44px);}
  .timeline::before{
    content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;border-radius:2px;
    background:linear-gradient(180deg,var(--coral),rgba(255,200,121,.35),transparent);
  }
  .step{position:relative;padding:0 0 clamp(26px,4vw,38px);}
  .step:last-child{padding-bottom:0;}
  .step::before{
    content:"";position:absolute;left:calc(-1 * clamp(28px,5vw,44px) + 1px);top:7px;
    width:16px;height:16px;border-radius:50%;
    background:var(--bg);border:2px solid var(--coral);
    box-shadow:0 0 0 5px rgba(255,143,180,.16);
  }
  .step .when{color:var(--amber);margin-bottom:8px;}
  .step .what{font-size:clamp(1.05rem,2.2vw,1.22rem);color:var(--cream);font-weight:300;max-width:52ch;}
  .achievement-adder{margin-top:var(--gap);padding:clamp(22px,4vw,32px);border-radius:var(--r-xl);border:1px dashed rgba(255,255,255,.16);background:rgba(255,255,255,.03);}
  .achievement-adder h3{font-size:1.25rem;margin-bottom:6px;}
  .achievement-adder p{color:var(--muted);font-size:.92rem;font-weight:300;}
  /* los campos del formulario van alineados en una fila, sin el margen ni
     el centrado que traen los campos del candado */
  .achievement-form{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;margin-top:18px;align-items:center;}
  .achievement-form .field{min-width:0;margin:0;text-align:left;}
  .achievement-form .btn{white-space:nowrap;}
  @media(max-width:680px){.achievement-form{grid-template-columns:1fr;}.achievement-form .btn{width:100%;}}

  /* ============================================================
     9. CAPÍTULO 03 — CARTA
     ============================================================ */
  @property --flap{syntax:'<number>';inherits:true;initial-value:1;}
  @property --slide{syntax:'<number>';inherits:true;initial-value:1;}
  @property --exit{syntax:'<number>';inherits:true;initial-value:1;}
  @property --flap-vis{syntax:'<number>';inherits:true;initial-value:1;}

  /* Sin JavaScript o con movimiento reducido, la carta ya está abierta.
     El JS pone .is-closed; al tocar el sobre pasa a .is-open y las variables
     (registradas con @property) se animan solas, en orden:
     solapa → la solapa se esconde → sale la carta → el sobre se retira. */
  #carta{--flap:1;--slide:1;--exit:1;--flap-vis:0;padding-top:clamp(48px,7vw,88px);}
  #carta.is-closed{--flap:0;--slide:0;--exit:0;--flap-vis:1;}
  #carta.is-open{
    --flap:1;--slide:1;--exit:1;--flap-vis:0;
    transition:
      --flap 950ms var(--ease-soft),
      --flap-vis 200ms ease 300ms,
      --slide 1150ms var(--ease-soft) 560ms,
      --exit 750ms var(--ease-out) 1350ms;
  }
  .is-closed .envelope-scene{cursor:pointer;}
  .is-closed .env-seal{animation:sealPulse 2.4s ease-in-out infinite;}
  @keyframes sealPulse{0%,100%{box-shadow:0 2px 8px rgba(0,0,0,.35),0 0 0 0 rgba(255,143,180,.45);}50%{box-shadow:0 2px 8px rgba(0,0,0,.35),0 0 0 14px rgba(255,143,180,0);}}
  @media (hover:hover) and (pointer:fine){
    .is-closed .envelope-scene:hover .env-front,.is-closed .envelope-scene:hover .env-back{filter:brightness(1.06);}
  }
  #carta .chapter-title{margin-bottom:0;}
  .envelope-frame{max-width:620px;margin:clamp(10px,2vw,20px) auto 0;filter:drop-shadow(0 30px 55px rgba(6,3,14,.6));}
  .envelope-scene{
    position:relative;perspective:1600px;
    /* recorta solo hacia abajo y deja que el sobre, más ancho, sobresalga a los lados */
    clip-path:inset(-150px -14% 0 -14%);
    border-radius:var(--r-lg);
  }
  .envelope-scene::before{
    content:"";position:absolute;inset:0 0 38% 0;z-index:0;pointer-events:none;
    background:radial-gradient(70% 60% at 50% 75%,rgba(255,158,196,.18),transparent 70%);
    opacity:calc(1 - var(--slide) * 1.4);
  }

  /* --- El papel --- */
  .paper{
    position:relative;z-index:2;
    padding:clamp(30px,5vw,56px) clamp(28px,5vw,56px) clamp(22px,3vw,30px);
    border-radius:var(--r-lg);
    background:linear-gradient(180deg,#fbf6ec,#f2e8d7);
    color:#2f2735;
    transform:
      translateY(calc((1 - var(--slide)) * var(--tuck,60%)))
      rotate(calc((1 - var(--slide)) * -1.1deg))
      scale(calc(1 - (1 - var(--slide)) * .04));
    transform-origin:50% 100%;
  }
  /* marca de agua floral, en la franja de las flechas para no pisar el texto */
  .paper-rose{position:absolute;right:4%;bottom:1%;width:96px;height:96px;color:#c8446b;opacity:.06;pointer-events:none;}
  /* La hoja mide lo que mide la página activa y cambia de alto con suavidad:
     así una página corta no deja un vacío antes de las flechas. */
  .sheet{position:relative;transition:height 380ms var(--ease-soft);}
  .page{
    position:absolute;top:0;left:0;right:0;
    opacity:0;transform:translateY(10px);pointer-events:none;
    transition:opacity 420ms var(--ease-out), transform 420ms var(--ease-soft);
  }
  .page.is-active{opacity:1;transform:none;pointer-events:auto;}
  .page p{
    font-family:'Lora',Georgia,serif;font-weight:400;
    font-size:clamp(1.02rem,2.1vw,1.2rem);line-height:1.8;
    color:#332b3b;margin-bottom:1.05em;max-width:56ch;
  }
  .page p:last-child{margin-bottom:0;}
  .page-open{font-size:clamp(1.15rem,2.6vw,1.4rem) !important;}
  .letter-sign{margin-top:1.4em !important;font-style:italic;color:#a8294f !important;text-align:right;max-width:none !important;}
  .pager{
    display:flex;align-items:center;justify-content:center;gap:16px;
    margin-top:clamp(20px,3vw,30px);padding-top:16px;
    border-top:1px solid rgba(80,55,45,.14);
  }
  .pg-btn{
    width:40px;height:40px;border-radius:var(--r-pill);cursor:pointer;
    border:1px solid rgba(80,55,45,.22);background:rgba(255,255,255,.5);
    color:#7a3550;font-size:1.25rem;line-height:1;display:grid;place-items:center;
    transition:transform 160ms var(--ease-out), background 160ms var(--ease-out), opacity 160ms var(--ease-out);
  }
  .pg-btn:active{transform:scale(.92);}
  .pg-btn[disabled]{opacity:.3;cursor:default;}
  .pg-count{color:#8a5568;font-variant-numeric:tabular-nums;}
  @media (hover:hover) and (pointer:fine){.pg-btn:not([disabled]):hover{background:#fff;transform:translateY(-1px);}}

  /* --- El sobre --- */
  /* pointer-events:none: el clic lo recibe la escena; si no, la solapa ya
     invisible tapaba los botones para pasar de página */
  .env-back,.env-front,.env-flap{position:absolute;left:-10%;right:-10%;opacity:calc(1 - var(--exit));pointer-events:none;}
  .env-back{
    bottom:0;z-index:1;aspect-ratio:1.55;
    background:linear-gradient(180deg,#8e3453,#742a44);
    border-radius:var(--r-md);
    transform:translateY(calc(var(--exit) * 104%));
  }
  .env-front{
    bottom:0;z-index:3;aspect-ratio:1.55;
    background:linear-gradient(170deg,#b85a78,#9a4360);
    border-radius:var(--r-md);
    clip-path:polygon(0 0, 50% 44%, 100% 0, 100% 100%, 0 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14);
    transform:translateY(calc(var(--exit) * 104%));
  }
  .env-front::after{
    content:"";position:absolute;left:50%;bottom:14%;transform:translateX(-50%);
    width:min(190px,42%);aspect-ratio:3;opacity:.28;
    background:no-repeat center/contain url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 40' fill='none' stroke='%23ffe3ec' stroke-width='2' stroke-linecap='round'><path d='M8 20h44M68 20h44'/><path d='M60 8c5 4 5 20 0 24-5-4-5-20 0-24z'/><path d='M40 20c-4-6-11-7-15-4 2 5 9 8 15 4zM80 20c4-6 11-7 15-4-2 5-9 8-15 4z'/></svg>");
  }
  .env-front::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(115deg,rgba(0,0,0,.10) 0 42%,transparent 42%),linear-gradient(245deg,rgba(0,0,0,.10) 0 42%,transparent 42%);
    opacity:.4;
  }
  .env-flap{
    bottom:var(--env-h,62%);              /* bisagra en el borde superior del sobre; lo mide el JS */
    z-index:4;aspect-ratio:3.6;
    transform-origin:50% 100%;
    transform:translateY(calc(var(--exit) * 260%)) rotateX(calc((1 - var(--flap)) * 180deg));
    background:linear-gradient(180deg,#c8688a,#a84463);
    clip-path:polygon(0 100%, 100% 100%, 50% 0);
    display:grid;place-items:center;
    opacity:calc((1 - var(--exit)) * var(--flap-vis));
  }
  .env-seal svg{width:62%;height:62%;color:#ffe3ea;}
  .env-seal{
    width:clamp(34px,4.4vw,46px);aspect-ratio:1;border-radius:50%;
    display:grid;place-items:center;
    background:radial-gradient(circle at 32% 30%,#e0708f,#8f2846);
    box-shadow:0 2px 8px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25);
    transform:translateY(28%) scale(calc(1 - var(--flap) * .35));
    opacity:calc(1 - var(--flap) * 1.8);
  }
  .env-hint{margin-top:14px;text-align:center;color:var(--muted);opacity:calc(1 - var(--slide,1) * 2.2);transition:opacity 300ms var(--ease-out);}
  @media(max-width:600px){
    .paper{padding:28px 22px 18px;}
    .page p{font-size:1rem;line-height:1.75;}
    .paper-rose{width:72px;height:72px;}
    .env-back,.env-front{aspect-ratio:1.2;}
    .env-flap{aspect-ratio:2.8;}
  }

  /* ============================================================
     10. CAPÍTULO 04 — MOSAICO DE FOTOS
     ============================================================ */
  .mosaic{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);grid-auto-rows:8px;column-gap:var(--gap);row-gap:0;}
  @media(max-width:900px){.mosaic{--cols:2;}}
  @media(max-width:380px){.mosaic{--cols:1;}}
  .shot{
    align-self:start;margin:0;
    border-radius:var(--r-md);overflow:hidden;position:relative;
    background:var(--bg-2);border:1px solid var(--line-soft);
    box-shadow:var(--shadow-soft);cursor:zoom-in;
    opacity:0;transform:translateY(22px) scale(.985);filter:blur(8px);
  }
  .shot.in{opacity:1;transform:none;filter:blur(0);transition:opacity 820ms var(--ease-out), transform 820ms var(--ease-soft), filter 820ms var(--ease-out);}
  .shot img{width:100%;height:100%;object-fit:cover;transition:transform 620ms var(--ease-soft), filter 400ms var(--ease-out);}
  @media (hover:hover) and (pointer:fine){
    .shot:hover img{transform:scale(1.045);filter:saturate(1.08);}
    .btn:not([disabled]):hover{transform:translateY(-2px);filter:brightness(1.04);box-shadow:0 18px 36px -14px rgba(255,143,180,.65);}
    .btn-ghost:hover{background:var(--glass);filter:none;}
    .cue:hover{color:var(--cream);}
  }
  .empty{padding:clamp(32px,6vw,56px);border-radius:var(--r-xl);text-align:center;border:1px dashed rgba(255,255,255,.16);background:rgba(255,255,255,.03);}
  .empty .big{font-size:32px;display:block;margin-bottom:14px;}
  .empty p{color:var(--muted);font-weight:300;max-width:46ch;margin:0 auto;}
  .empty code{font-family:'DM Mono',monospace;font-size:.86em;color:var(--amber);background:rgba(255,200,121,.1);padding:2px 7px;border-radius:6px;}
  .adder{
    margin-top:var(--gap);padding:clamp(22px,4vw,32px);border-radius:var(--r-xl);
    border:1px dashed rgba(255,255,255,.16);background:rgba(255,255,255,.03);
    display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap;
  }
  .adder h3{font-size:1.25rem;margin-bottom:6px;}
  .adder p{color:var(--muted);font-size:.92rem;font-weight:300;max-width:48ch;}
  .adder-status{width:100%;color:var(--muted);font-size:.86rem;font-weight:300;}

  /* ============================================================
     11. CAPÍTULO 05 — VIDEOS
     ============================================================ */
  .films{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap);}
  @media(max-width:720px){.films{grid-template-columns:1fr;}}
  .film{
    position:relative;border-radius:var(--r-lg);overflow:hidden;
    aspect-ratio:16/10;border:1px solid var(--line-soft);
    background:
      radial-gradient(90% 90% at 30% 20%,hsl(var(--hue,20) 70% 60% / .20),transparent 62%),
      radial-gradient(80% 80% at 85% 90%,rgba(255,200,121,.10),transparent 60%),
      var(--bg-2);
    box-shadow:var(--shadow-soft);display:grid;place-items:center;cursor:pointer;
  }
  .film-time{opacity:.7;}
  .film-note{color:var(--amber);opacity:.9;}
  .film video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;}
  .film-face{display:grid;place-items:center;gap:12px;text-align:center;padding:16px;}
  .film-play{width:58px;height:58px;border-radius:var(--r-pill);display:grid;place-items:center;background:var(--glass-strong);border:1px solid var(--line);transition:transform 220ms var(--ease-out);}
  .film-face .mono{color:var(--muted);}
  @media (hover:hover) and (pointer:fine){.film:hover .film-play{transform:scale(1.08);}}

  /* ============================================================
     12. CAPÍTULO 06 — PRIVADO
     ============================================================ */
  #privada .card{padding:clamp(28px,5vw,52px);border-radius:var(--r-xl);}
  .lock{max-width:400px;margin:0 auto;text-align:center;}
  .lock h3{font-size:clamp(1.5rem,4vw,2rem);margin-bottom:10px;}
  .lock p{color:var(--muted);font-weight:300;margin-bottom:24px;}
  #inner-lock{transition:opacity 380ms var(--ease-out), filter 380ms var(--ease-out);}
  #inner-lock.closing{opacity:0;filter:blur(8px);pointer-events:none;}
  #inner-content{opacity:0;}
  #inner-content.revealed{opacity:1;transition:opacity 560ms var(--ease-out);}
  .inner-msg{font-family:'Lora',Georgia,serif;font-size:clamp(1.05rem,2.3vw,1.28rem);line-height:1.85;white-space:pre-line;max-width:58ch;color:#efe8f2;}
  #private-mosaic{display:flex;justify-content:center;align-items:flex-start;}
  #private-mosaic .shot{
    width:min(100%,360px);padding:12px;aspect-ratio:auto !important;
    border:1px solid rgba(233,192,138,.48);border-radius:8px;
    background:linear-gradient(145deg,#fffaf1,#eee3d1);
    box-shadow:0 28px 60px -34px rgba(0,0,0,.88),0 9px 24px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.9);
  }
  #private-mosaic .shot img{
    width:100%;height:auto;aspect-ratio:3 / 4;object-fit:cover;
    border:1px solid rgba(99,62,76,.22);border-radius:3px;
  }
  @media(max-width:480px){
    #private-mosaic .shot{width:min(100%,320px);padding:9px;}
  }
  .private-quote{
    max-width:46ch;margin:28px auto 0;color:var(--rose-soft);
    font-family:'Lora',Georgia,serif;font-size:clamp(1.05rem,2.5vw,1.3rem);
    line-height:1.75;text-align:center;text-wrap:pretty;
  }
  .private-quote em{color:var(--amber);font-weight:500;}

  /* ---------- La rosa eterna bajo su campana de vidrio ---------- */
  .eternal{width:min(300px,78%);margin:0 auto;}
  .dome{
    position:relative;aspect-ratio:.78;overflow:hidden;
    display:grid;place-items:end center;padding-bottom:9%;
    border-radius:46% 46% 10% 10% / 36% 36% 6% 6%;
    border:1px solid rgba(255,255,255,.22);
    background:linear-gradient(158deg,rgba(255,255,255,.16),rgba(255,255,255,.03) 46%,rgba(255,255,255,.09));
    box-shadow:inset 0 0 70px rgba(255,170,200,.16), 0 34px 60px -34px rgba(0,0,0,.9);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  }
  .dome::after{content:"";position:absolute;left:15%;top:9%;width:20%;height:54%;background:linear-gradient(180deg,rgba(255,255,255,.55),transparent);border-radius:50%;filter:blur(7px);opacity:.5;}
  .dome-glow{position:absolute;bottom:16%;width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,140,175,.5),transparent 68%);animation:glowBreath 5.5s ease-in-out infinite;}
  @keyframes glowBreath{0%,100%{opacity:.55;transform:scale(.94);}50%{opacity:1;transform:scale(1.06);}}
  .rose-big{position:relative;width:52%;filter:drop-shadow(0 0 18px rgba(255,110,155,.6));animation:roseBreath 7s ease-in-out infinite;}
  @keyframes roseBreath{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-5px) rotate(1deg);}}
  .drop-petal,.rest-petal{position:absolute;width:11px;height:11px;border-radius:70% 0 70% 0;background:linear-gradient(140deg,var(--rose),var(--rose-deep));}
  .drop-petal{top:38%;opacity:0;animation:petalDrop 11s ease-in infinite;}
  .drop-petal.d1{left:38%;animation-delay:0s;}
  .drop-petal.d2{left:56%;animation-delay:3.8s;--dx:-18px;}
  .drop-petal.d3{left:47%;animation-delay:7.4s;--dx:9px;}
  @keyframes petalDrop{0%{transform:translate(0,0) rotate(0);opacity:0;}8%{opacity:.95;}70%{opacity:.9;}100%{transform:translate(var(--dx,14px),150px) rotate(320deg);opacity:0;}}
  .rest-petal{bottom:7%;opacity:.85;}
  .rest-petal.r1{left:36%;transform:rotate(18deg);}
  .rest-petal.r2{left:52%;transform:rotate(-24deg) scale(.9);}
  .rest-petal.r3{left:62%;transform:rotate(48deg) scale(.8);}
  .dome-base{width:112%;margin:-10px 0 0 -6%;height:28px;border-radius:8px 8px 14px 14px / 10px 10px 40px 40px;background:linear-gradient(180deg,#8d5a63,#3a1b26);box-shadow:0 22px 36px -20px #000, inset 0 1px 0 rgba(255,205,165,.3);}
  .eternal-caption{text-align:center;color:var(--rose);opacity:.75;margin:18px 0 clamp(24px,4vw,36px);}

  /* ============================================================
     13. LIGHTBOX
     ============================================================ */
  .lb{position:fixed;inset:0;z-index:400;display:grid;place-items:center;padding:clamp(14px,3vw,40px);background:rgba(10,7,18,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:lbIn 260ms var(--ease-out) both;}
  @keyframes lbIn{from{opacity:0;}to{opacity:1;}}
  .lb img{max-width:100%;max-height:calc(100svh - 130px);width:auto;border-radius:var(--r-md);box-shadow:0 40px 90px -30px rgba(0,0,0,.9);animation:lbZoom 340ms var(--ease-soft) both;}
  @keyframes lbZoom{from{opacity:0;transform:scale(.965);}to{opacity:1;transform:none;}}
  .lb-bar{position:absolute;left:0;right:0;bottom:clamp(14px,3vw,26px);display:flex;align-items:center;justify-content:center;gap:14px;}
  .lb-btn{width:46px;height:46px;border-radius:var(--r-pill);border:1px solid var(--line);background:rgba(255,255,255,.08);backdrop-filter:blur(10px);display:grid;place-items:center;cursor:pointer;font-size:1.2rem;transition:transform 160ms var(--ease-out), background 160ms var(--ease-out);}
  .lb-btn:active{transform:scale(.92);}
  .lb-count{font-family:'DM Mono',monospace;font-size:.8rem;color:var(--muted);padding:0 8px;font-variant-numeric:tabular-nums;}
  .lb-close{position:absolute;top:clamp(14px,3vw,24px);right:clamp(14px,3vw,24px);}
  @media (hover:hover) and (pointer:fine){.lb-btn:hover{background:rgba(255,255,255,.16);}}

  /* ============================================================
     14. PIE · 15. MOVIMIENTO REDUCIDO
     ============================================================ */
  footer{padding:70px 0 90px;text-align:center;color:var(--muted);}
  footer .heart{color:var(--coral);}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}
    .rise,.shot{opacity:1 !important;transform:none !important;filter:none !important;}
  }
</style>
</head>

<!-- ============ ENTRADA ============ -->
<div id="gate">
  <div class="gate-card card">
    <div class="gate-seal"><svg viewBox="0 0 100 100" class="rose-mark" style="width:60%;height:60%"><use href="#ic-rose"/></svg></div>
    <h1>Para Daniela</h1>
    <p class="sub">Un lugar hecho para celebrar tu historia.<br><br><strong>Pista:</strong> mi nombre tiene siete letras, pero en los momentos más cercanos solo usamos cuatro.</p>

</main>

const $ = sel => document.querySelector(sel);
const norm = s => s.trim().toLowerCase().replace(/\s+/g, ' ');

function shake(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

/* ============================================================
   Descifrado
   El contenido viene cifrado con AES-256-GCM. La llave del contenido está
   "envuelta" una vez por cada clave válida; probamos cada envoltura con la
   clave escrita y, si alguna abre (GCM valida la autenticidad), tenemos la
   llave. Con la clave equivocada no hay forma de recuperar el texto.
   ============================================================ */
const enc = new TextEncoder(), dec = new TextDecoder();
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriveKey(password, salt, iterations) {
  const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}
async function unlock(blobId, password) {
  const raw = document.getElementById(blobId).textContent.trim();
  if (!raw) return null;
  const meta = JSON.parse(raw);
  for (const w of meta.wraps) {
    try {
      const kek = await deriveKey(password, fromB64(w.salt), meta.iter);
      const keyBytes = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(w.iv) }, kek, fromB64(w.ct));
      const key = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(meta.iv) }, key, fromB64(meta.ct));
      return dec.decode(plain);
    } catch (e) { /* esta envoltura no abre con esa clave: probamos la siguiente */ }
  }
  return null;
}
const cryptoOk = !!(window.crypto && crypto.subtle);

  const gate = $('#gate'), main = $('#main-content');
  $('#story').innerHTML = html;
  main.classList.remove('hidden');   // primero visible, para poder medir la carta
  initStory();
  gate.classList.add('closing');
  requestAnimationFrame(() => main.classList.add('revealed'));
  setTimeout(() => gate.classList.add('hidden'), 480);
}
$('#gate-btn').addEventListener('click', openStory);
$('#gate-input').addEventListener('keydown', e => { if (e.key === 'Enter') openStory(); });
$('#gate-input').focus();

/* ============================================================
   Reveals al entrar en pantalla (con leve escalonado)
   ============================================================ */
const revealer = new IntersectionObserver((entries) => {
  entries.forEach((entry, i) => {
    if (!entry.isIntersecting) return;
    const el = entry.target;
    el.style.transitionDelay = Math.min(i, 6) * 55 + 'ms';
    el.classList.add('in');
    revealer.unobserve(el);
  });
}, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });

/* ============================================================
   Todo lo que necesita el contenido ya descifrado
   ============================================================ */
function initStory() {
  document.querySelectorAll('.rise').forEach(el => revealer.observe(el));
  initCounter();
  initMosaic();
  initFilms();
  initAchievements();
  initLetter();
  initPrivate();
}

/* ---------- Contador ---------- */
function initCounter() {
  const tick = () => {
    let diff = Math.max(0, Date.now() - CONFIG.startDate.getTime());
    const d = Math.floor(diff / 864e5); diff -= d * 864e5;
    const h = Math.floor(diff / 36e5); diff -= h * 36e5;
    const m = Math.floor(diff / 6e4); diff -= m * 6e4;
    const s = Math.floor(diff / 1e3);
    $('#c-days').textContent = d;
    $('#c-hours').textContent = String(h).padStart(2, '0');
    $('#c-min').textContent = String(m).padStart(2, '0');
    $('#c-sec').textContent = String(s).padStart(2, '0');
  };
  tick(); setInterval(tick, 1000);
  $('#year').textContent = new Date().getFullYear();
}

/* ---------- Mosaico de fotos ----------
   Cada foto se pide sola al acercarse a la pantalla. Si un archivo no
   existe, su hueco se retira y el mosaico se reacomoda. */
let liveShots = 0;
const ROW_UNIT = 8;
function sizeShot(fig) {
  const grid = fig.parentElement;
  if (!grid || !fig.dataset.ratio) return;
  const gap = parseFloat(getComputedStyle(grid).columnGap) || 20;
  const width = fig.getBoundingClientRect().width;
  if (!width) return;
  const [rw, rh] = fig.dataset.ratio.split('/').map(Number);
  if (!rw || !rh) return;
  fig.style.gridRowEnd = 'span ' + Math.ceil((width * (rh / rw) + gap) / ROW_UNIT);
}
const mosaicResize = new ResizeObserver(entries => entries.forEach(e => e.target.querySelectorAll('.shot').forEach(sizeShot)));

function makeShot(src, alt, ratio, container) {
  const fig = document.createElement('figure');
  fig.className = 'shot';
  if (ratio) { fig.dataset.ratio = ratio; fig.style.aspectRatio = ratio; }
  const img = document.createElement('img');
  img.src = src; img.alt = alt; img.loading = 'lazy'; img.decoding = 'async';
  img.addEventListener('error', () => { fig.remove(); if (container === $('#mosaic')) checkMosaicEmpty(); });
  img.addEventListener('load', () => {
    if (img.naturalWidth) { const real = img.naturalWidth + '/' + img.naturalHeight; fig.dataset.ratio = real; fig.style.aspectRatio = real; }
    sizeShot(fig);
    if (container === $('#mosaic')) { liveShots++; hideMosaicEmpty(); }
  });
  fig.appendChild(img);
  fig.addEventListener('click', () => openLightbox(fig));
  container.appendChild(fig);
  sizeShot(fig);
  revealer.observe(fig);
  return fig;
}
function updateShotCount() { const n = $('#mosaic').children.length; $('#shot-count').textContent = n ? `· ${n} fotos` : ''; }
function checkMosaicEmpty() { if (!$('#mosaic').children.length) $('#mosaic-empty').classList.remove('hidden'); updateShotCount(); }
function hideMosaicEmpty() { $('#mosaic-empty').classList.add('hidden'); updateShotCount(); }

function initMosaic() {
  const grid = $('#mosaic');
  for (let i = 1; i <= CONFIG.galleryCount; i++) {
    makeShot(`fotos/foto-${String(i).padStart(3, '0')}.jpg`, `Momento ${i}`, CONFIG.photoAspectRatios[i - 1], grid);
  }
  mosaicResize.observe(grid);
  setTimeout(() => { if (!liveShots) checkMosaicEmpty(); }, 2500);
  loadSavedPhotos();
  $('#photo-upload').addEventListener('change', onPhotoUpload);
}

function buildPrivateMedia() {
  const box = $('#private-mosaic');
  if (!box || box.dataset.done) return;
  box.dataset.done = '1';
  CONFIG.privateFiles.forEach((file, i) => {
    if (/\.(mp4|webm|mov)$/i.test(file)) {
      const v = document.createElement('video');
      v.src = `fotos/${file}`; v.controls = true; v.preload = 'metadata';
      v.style.borderRadius = 'var(--r-md)'; v.style.marginBottom = 'var(--gap)';
      v.addEventListener('error', () => v.remove());
      box.appendChild(v);
    } else {
      makeShot(`fotos/${file}`, `Privado ${i + 1}`, null, box);
    }
  });
}

/* ---------- Lo que ella guarda en su propio navegador (IndexedDB) ---------- */
const DB_NAME = 'daniela-graduation-gallery', STORE = 'photos', ACHIEVEMENTS_STORE = 'achievements';
function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, 2);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
      if (!db.objectStoreNames.contains(ACHIEVEMENTS_STORE)) db.createObjectStore(ACHIEVEMENTS_STORE, { keyPath: 'id', autoIncrement: true });
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
async function loadSavedPhotos() {
  try {
    const db = await openDB();
    const req = db.transaction(STORE, 'readonly').objectStore(STORE).getAll();
    req.onsuccess = () => {
      req.result.forEach((row, i) => makeShot(URL.createObjectURL(row.file), `Foto añadida ${i + 1}`, null, $('#mosaic')));
      if (req.result.length) { $('#adder-status').textContent = `${req.result.length} foto(s) guardada(s) en este dispositivo.`; hideMosaicEmpty(); }
      db.close();
    };
  } catch (e) { /* sin IndexedDB, el resto sigue igual */ }
}
async function onPhotoUpload(ev) {
  const files = [...ev.target.files];
  if (!files.length) return;
  try {
    const db = await openDB();
    const tx = db.transaction(STORE, 'readwrite');
    const store = tx.objectStore(STORE);
    files.forEach(file => store.add({ file, name: file.name, addedAt: Date.now() }));
    tx.oncomplete = () => {
      files.forEach((file, i) => makeShot(URL.createObjectURL(file), `Foto añadida ${i + 1}`, null, $('#mosaic')));
      $('#adder-status').textContent = `${files.length} foto(s) agregada(s) y guardada(s) en este dispositivo.`;
      hideMosaicEmpty(); db.close();
    };
    tx.onerror = () => { $('#adder-status').textContent = 'No se pudieron guardar. Revisa el espacio del navegador.'; db.close(); };
  } catch (e) {
    $('#adder-status').textContent = 'Este navegador no permite guardar fotos localmente.';
  } finally { ev.target.value = ''; }
}

/* ---------- Logros añadidos desde este navegador ---------- */
function makeAchievement(title, description) {
  const step = document.createElement('div');
  step.className = 'step rise in';
  const when = document.createElement('div'); when.className = 'when mono'; when.textContent = title;
  const what = document.createElement('p'); what.className = 'what'; what.textContent = description;
  step.append(when, what);
  $('#achievements-timeline').appendChild(step);
}
async function initAchievements() {
  const status = $('#achievement-status');
  try {
    const db = await openDB();
    const req = db.transaction(ACHIEVEMENTS_STORE, 'readonly').objectStore(ACHIEVEMENTS_STORE).getAll();
    req.onsuccess = () => {
      req.result.forEach(a => makeAchievement(a.title, a.description));
      if (req.result.length) status.textContent = `${req.result.length} logro(s) añadido(s) en este dispositivo.`;
      db.close();
    };
    req.onerror = () => db.close();
  } catch (e) { status.textContent = 'Este navegador no permite guardar logros localmente.'; }

  $('#achievement-form').addEventListener('submit', async event => {
    event.preventDefault();
    const title = $('#achievement-title').value.trim();
    const description = $('#achievement-description').value.trim();
    if (!title || !description) return;
    try {
      const db = await openDB();
      const tx = db.transaction(ACHIEVEMENTS_STORE, 'readwrite');
      tx.objectStore(ACHIEVEMENTS_STORE).add({ title, description, addedAt: Date.now() });
      tx.oncomplete = () => { makeAchievement(title, description); status.textContent = 'Logro agregado y guardado en este dispositivo.'; event.target.reset(); db.close(); };
      tx.onerror = () => { status.textContent = 'No se pudo guardar el logro. Revisa el espacio del navegador.'; db.close(); };
    } catch (e) { status.textContent = 'Este navegador no permite guardar logros localmente.'; }
  });
}

/* ---------- Videos: tarjeta con play; el archivo se pide al tocarla ---------- */
const servedOverHttp = location.protocol === 'http:' || location.protocol === 'https:';
function checkFilmsEmpty() { if (!$('#films').children.length) $('#films-empty').classList.remove('hidden'); }
function markFilmReady(card, seconds) {
  card.dataset.ready = '1';
  const secs = Math.round(seconds || 0);
  if (secs) card.querySelector('.film-time').textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
}
/* Publicada (http/https) preguntamos por el archivo con HEAD; abriendo el
   index.html localmente (file://) fetch no está permitido y usamos un <video>. */
const filmProbe = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (!entry.isIntersecting) return;
    const card = entry.target;
    filmProbe.unobserve(card);
    const src = `fotos/${card.dataset.file}`;
    const drop = () => { card.remove(); checkFilmsEmpty(); };
    if (servedOverHttp) {
      fetch(src, { method: 'HEAD' }).then(r => { r.ok ? markFilmReady(card) : drop(); }).catch(drop);
    } else {
      const probe = document.createElement('video');
      probe.preload = 'metadata'; probe.muted = true; probe.src = src;
      probe.addEventListener('error', drop);
      probe.addEventListener('loadedmetadata', () => markFilmReady(card, probe.duration));
    }
  });
}, { rootMargin: '400px' });

function initFilms() {
  const grid = $('#films');
  CONFIG.videoFiles.forEach((file, i) => {
    const card = document.createElement('div');
    card.className = 'film rise';
    card.dataset.file = file;
    card.style.setProperty('--hue', (i * 37) % 360);
    card.innerHTML = `<div class="film-face">
        <div class="film-play" aria-hidden="true">▶</div>
        <span class="mono">Video ${String(i + 1).padStart(2, '0')} <span class="film-time"></span></span>
      </div>`;
    card.addEventListener('click', () => {
      if (card.dataset.playing) return;
      card.dataset.playing = '1';
      const v = document.createElement('video');
      v.src = `fotos/${file}`; v.controls = true; v.autoplay = true; v.playsInline = true;
      v.setAttribute('aria-label', `Video ${i + 1}`);
      // si falla al reproducir no borramos la tarjeta bajo el dedo: avisamos
      v.addEventListener('error', () => {
        v.remove(); delete card.dataset.playing;
        const face = card.querySelector('.film-face');
        const old = face.querySelector('.film-note'); if (old) old.remove();
        const note = document.createElement('span'); note.className = 'mono film-note'; note.textContent = 'No se pudo reproducir';
        face.appendChild(note);
      });
      card.appendChild(v);
    });
    grid.appendChild(card);
    revealer.observe(card);
    filmProbe.observe(card);
  });
}

/* ---------- Pétalos cayendo ---------- */
(function spawnPetals(count) {
  const box = $('#petals');
  if (!box || reduced) return;
  for (let i = 0; i < count; i++) {
    const petal = document.createElement('span');
    petal.className = 'petal';
    const size = 8 + Math.random() * 9;
    petal.style.left = Math.random() * 100 + '%';
    petal.style.width = petal.style.height = size + 'px';
    petal.style.animationDuration = (16 + Math.random() * 14) + 's';
    petal.style.animationDelay = (-Math.random() * 24) + 's';
    petal.style.setProperty('--drift', (Math.random() * 170 - 85) + 'px');
    box.appendChild(petal);
  }
})(14);

/* ---------- Lightbox ---------- */
function openLightbox(fromFig) {
  const shots = [...document.querySelectorAll('#mosaic .shot img')];
  let index = Math.max(0, shots.findIndex(img => img === fromFig.querySelector('img')));
  const lb = document.createElement('div');
  lb.className = 'lb'; lb.setAttribute('role', 'dialog'); lb.setAttribute('aria-modal', 'true');
  lb.innerHTML = `
    <img alt="">
    <button class="lb-btn lb-close" type="button" aria-label="Cerrar">✕</button>
    <div class="lb-bar">
      <button class="lb-btn" data-prev type="button" aria-label="Anterior">‹</button>
      <span class="lb-count"></span>
      <button class="lb-btn" data-next type="button" aria-label="Siguiente">›</button>
    </div>`;
  document.body.appendChild(lb);
  document.body.style.overflow = 'hidden';
  const imgEl = lb.querySelector('img'), countEl = lb.querySelector('.lb-count');
  const show = i => {
    index = (i + shots.length) % shots.length;
    imgEl.src = shots[index].src; imgEl.alt = shots[index].alt;
    countEl.textContent = `${String(index + 1).padStart(2, '0')} / ${String(shots.length).padStart(2, '0')}`;
  };
  const close = () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = ''; lb.remove(); };
  const onKey = e => { if (e.key === 'Escape') close(); if (e.key === 'ArrowRight') show(index + 1); if (e.key === 'ArrowLeft') show(index - 1); };
  lb.querySelector('.lb-close').addEventListener('click', close);
  lb.querySelector('[data-prev]').addEventListener('click', () => show(index - 1));
  lb.querySelector('[data-next]').addEventListener('click', () => show(index + 1));
  lb.addEventListener('click', e => { if (e.target === lb) close(); });
  document.addEventListener('keydown', onKey);
  show(index);
}

/* ---------- La carta: hojas + sobre que se abre al tocarlo ---------- */
function initLetter() {
  const cartaSection = $('#carta');
  const scene = $('#envelope-scene');
  const envBack = scene.querySelector('.env-back');
  const paper = scene.querySelector('.paper');
  const sheet = $('#sheet');
  const pages = [...sheet.querySelectorAll('.page')];
  const prevBtn = cartaSection.querySelector('[data-prev]');
  const nextBtn = cartaSection.querySelector('[data-next]');
  let pageIndex = 0;

  // la hoja mide lo que mide la página activa (la transición la suaviza)
  const fitSheet = () => { sheet.style.height = pages[pageIndex].scrollHeight + 'px'; };
  const showPage = i => {
    pageIndex = Math.max(0, Math.min(pages.length - 1, i));
    pages.forEach((p, n) => p.classList.toggle('is-active', n === pageIndex));
    $('#pg-count').textContent = `${String(pageIndex + 1).padStart(2, '0')} / ${String(pages.length).padStart(2, '0')}`;
    prevBtn.disabled = pageIndex === 0;
    nextBtn.disabled = pageIndex === pages.length - 1;
    fitSheet();
  };
  prevBtn.addEventListener('click', () => showPage(pageIndex - 1));
  nextBtn.addEventListener('click', () => showPage(pageIndex + 1));
  paper.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') showPage(pageIndex - 1);
    if (e.key === 'ArrowRight') showPage(pageIndex + 1);
  });
  // deslizar con el dedo, solo si el gesto es claramente horizontal
  let touchX = null, touchY = null;
  paper.addEventListener('touchstart', e => { touchX = e.changedTouches[0].clientX; touchY = e.changedTouches[0].clientY; }, { passive: true });
  paper.addEventListener('touchend', e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX, dy = e.changedTouches[0].clientY - touchY;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5) showPage(pageIndex + (dx < 0 ? 1 : -1));
    touchX = touchY = null;
  }, { passive: true });

  // cuánto baja la carta para esconderse dentro del sobre (se asoma un poco)
  const measureTuck = () => {
    const envH = envBack.offsetHeight;
    cartaSection.style.setProperty('--env-h', envH + 'px');
    cartaSection.style.setProperty('--tuck', Math.max(0, scene.clientHeight - envH * 0.75) + 'px');
  };
  const relayout = () => { fitSheet(); measureTuck(); };

  let letterOpened = reduced;
  const openLetter = () => {
    if (letterOpened) return;
    letterOpened = true;
    cartaSection.classList.remove('is-closed');
    cartaSection.classList.add('is-open');
    scene.setAttribute('aria-expanded', 'true');
    scene.removeAttribute('role'); scene.removeAttribute('tabindex'); scene.removeAttribute('aria-label');
  };
  scene.addEventListener('click', openLetter);
  scene.addEventListener('keydown', e => { if (!letterOpened && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openLetter(); } });

  showPage(0);
  relayout();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
  new ResizeObserver(measureTuck).observe(paper);

  if (!reduced) cartaSection.classList.add('is-closed');
  else { scene.removeAttribute('role'); scene.removeAttribute('tabindex'); scene.setAttribute('aria-expanded', 'true'); }
}

/* ---------- Capítulo privado: segunda clave, segundo bloque cifrado ---------- */
function initPrivate() {
  const btn = $('#inner-btn'), input = $('#inner-input'), err = $('#inner-error');
  let busy = false;
  const openPrivate = async () => {
    if (busy) return;
    const val = norm(input.value);
    if (!val) return;
    busy = true; btn.disabled = true; btn.textContent = 'Abriendo…'; err.textContent = '';
    const html = await unlock('blob-private', val);
    busy = false; btn.disabled = false; btn.textContent = 'Abrir el mensaje';
    if (html === null) { err.textContent = 'Esa palabra no es la correcta.'; shake($('#inner-lock')); input.select(); return; }
    const lock = $('#inner-lock'), content = $('#inner-content');
    content.innerHTML = html;
    lock.classList.add('closing');
    content.classList.remove('hidden');
    requestAnimationFrame(() => content.classList.add('revealed'));
    setTimeout(() => lock.classList.add('hidden'), 400);
    buildPrivateMedia();
  };
  btn.addEventListener('click', openPrivate);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') openPrivate(); });
}

/* ============================================================
   Parallax de los brillos + barra de progreso de respaldo
   ============================================================ */
const supportsScrollTimeline = CSS.supports && CSS.supports('animation-timeline', 'scroll()');
const blooms = [...document.querySelectorAll('.bloom')];
let ticking = false;
function onScroll() {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    const y = window.scrollY;
    if (!reduced) blooms.forEach(b => { b.style.transform = `translate3d(0,${y * parseFloat(b.dataset.speed || 0)}px,0)`; });
    if (!supportsScrollTimeline) {
      const max = document.documentElement.scrollHeight - innerHeight;
      $('#progress').style.transform = `scaleX(${max > 0 ? y / max : 0})`;
    }
    ticking = false;
  });
}
addEventListener('scroll', onScroll, { passive: true });
onScroll();
</script>
